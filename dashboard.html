<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — Agenda Escolar</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --accent2: #10b981;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
    --border: #334155;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 { font-size: 1.8rem; color: var(--accent); }
  header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-success { background: var(--accent2); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-box {
    background: var(--card);
    padding: 12px 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .stat-box .number { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
  .stat-box .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
  .day-section {
    background: var(--card);
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .day-header {
    padding: 14px 18px;
    background: rgba(59,130,246,0.1);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .day-header h2 { font-size: 1rem; color: var(--accent); }
  .day-header .badge {
    background: var(--accent);
    color: white;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 20px;
  }
  .events-list { padding: 8px 16px 16px; }
  .event-card {
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    padding: 14px;
    margin-top: 10px;
    border-left: 4px solid var(--accent);
    transition: all 0.3s;
  }
  .event-card.completed {
    opacity: 0.45;
    border-left-color: var(--accent2);
    text-decoration: line-through;
  }
  .event-card.hidden { display: none; }
  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .event-title { font-weight: 600; font-size: 0.95rem; }
  .event-time {
    font-size: 0.8rem;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 2px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .event-desc {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .event-meta {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .event-author { font-size: 0.8rem; color: var(--muted); }
  .event-actions { display: flex; gap: 8px; }
  .event-actions .btn { font-size: 0.8rem; padding: 6px 12px; }
  .event-actions .btn-success { background: var(--accent2); }
  .event-actions .btn-danger { background: var(--danger); }
  .attachments { margin-top: 8px; }
  .attachments a {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    margin-right: 12px;
  }
  .attachments a:hover { text-decoration: underline; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state h2 { color: var(--text); margin-bottom: 8px; }
  .filter-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-bar input, .filter-bar select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .filter-bar input { min-width: 200px; }
</style>
</head>
<body>

<header>
  <h1>📚 Hermes — Agenda Escolar</h1>
  <p>Gerencie seus deveres. Marque como concluído para não ver novamente.</p>
</header>

<div class="stats">
  <div class="stat-box">
    <div class="number" id="stat-total">0</div>
    <div class="label">Total</div>
  </div>
  <div class="stat-box">
    <div class="number" id="stat-pending">0</div>
    <div class="label">Pendentes</div>
  </div>
  <div class="stat-box">
    <div class="number" id="stat-done">0</div>
    <div class="label">Concluídos</div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" onclick="loadData()">🔄 Recarregar JSON</button>
  <button class="btn btn-success" onclick="exportCompleted()">📥 Exportar Concluídos</button>
  <button class="btn btn-danger" onclick="clearAllCompleted()">🗑️ Limpar Todos Concluídos</button>
</div>

<div class="filter-bar">
  <input type="text" id="search" placeholder="🔍 Buscar tarefa…" oninput="render()">
  <select id="filter-status" onchange="render()">
    <option value="all">Todas</option>
    <option value="pending">Pendentes</option>
    <option value="completed">Concluídas</option>
  </select>
</div>

<div id="agenda-container">
  <div class="empty-state">
    <h2>Aguardando dados</h2>
    <p>Clique em "Recarregar JSON" para carregar o arquivo <code>agenda_events_by_date.json</code></p>
  </div>
</div>

<script>
// ── Estado ────────────────────────────────────────────────
let agendaData = {};
let completedIds = new Set();

const STORAGE_KEY = 'hermes_completed_ids';

function loadCompleted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) completedIds = new Set(JSON.parse(raw));
  } catch(e) { console.error(e); }
}

function saveCompleted() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedIds]));
}

// ── Carregar JSON ─────────────────────────────────────────
function loadData() {
  fetch('agenda_events_by_date.json')
    .then(r => {
      if (!r.ok) throw new Error('JSON não encontrado. Rode extract_details.py primeiro.');
      return r.json();
    })
    .then(data => {
      agendaData = data;
      render();
    })
    .catch(err => {
      document.getElementById('agenda-container').innerHTML = `
        <div class="empty-state">
          <h2>❌ Erro ao carregar</h2>
          <p>${err.message}</p>
        </div>`;
    });
}

// ── Renderizar ────────────────────────────────────────────
function render() {
  const container = document.getElementById('agenda-container');
  const search = document.getElementById('search').value.toLowerCase();
  const filterStatus = document.getElementById('filter-status').value;

  const dates = Object.keys(agendaData).sort();
  if (dates.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h2>📭 Nenhuma tarefa</h2>
        <p>Não há eventos no intervalo atual.</p>
      </div>`;
    updateStats();
    return;
  }

  let html = '';
  let total = 0, pending = 0, done = 0;

  for (const dateStr of dates) {
    const events = agendaData[dateStr];
    const filtered = events.filter(ev => {
      const isDone = completedIds.has(ev.id);
      total++;
      if (isDone) done++; else pending++;

      if (filterStatus === 'pending' && isDone) return false;
      if (filterStatus === 'completed' && !isDone) return false;
      if (search) {
        const text = (ev.title + ' ' + ev.description + ' ' + ev.author).toLowerCase();
        if (!text.includes(search)) return false;
      }
      return true;
    });

    if (filtered.length === 0) continue;

    const dt = new Date(dateStr + 'T12:00:00');
    const weekdays = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const label = `${weekdays[dt.getDay()]}, ${dt.getDate().toString().padStart(2,'0')}/${(dt.getMonth()+1).toString().padStart(2,'0')}`;

    html += `<div class="day-section">
      <div class="day-header" onclick="toggleDay(this)">
        <h2>📅 ${label}</h2>
        <span class="badge">${filtered.length}</span>
      </div>
      <div class="events-list">`;

    for (const ev of filtered) {
      const isDone = completedIds.has(ev.id);
      const typeEmoji = {task:'📝', assignment:'📚', assessment:'📝', event:'📅', online_class:'💻'}[ev.type] || '📌';

      let attachments = '';
      if (ev.links && ev.links.length) {
        attachments = '<div class="attachments">' + 
          ev.links.map((l,i) => `<a href="${l}" target="_blank">📎 Anexo ${i+1}</a>`).join('') + 
          '</div>';
      }

      html += `
        <div class="event-card ${isDone ? 'completed' : ''}" data-id="${ev.id}">
          <div class="event-header">
            <div class="event-title">${typeEmoji} ${escapeHtml(ev.title)}</div>
            <div class="event-time">${ev.time}</div>
          </div>
          <div class="event-desc">${escapeHtml(ev.description || '')}</div>
          ${attachments}
          <div class="event-meta">
            <span class="event-author">👤 ${escapeHtml(ev.author)}</span>
            <div class="event-actions">
              ${isDone 
                ? `<button class="btn btn-danger" onclick="toggleDone('${ev.id}', false)">↩️ Desfazer</button>`
                : `<button class="btn btn-success" onclick="toggleDone('${ev.id}', true)">✅ Concluir</button>`
              }
            </div>
          </div>
        </div>`;
    }

    html += '</div></div>';
  }

  container.innerHTML = html || `
    <div class="empty-state">
      <h2>📭 Nenhuma tarefa encontrada</h2>
      <p>Tente ajustar os filtros ou a busca.</p>
    </div>`;

  updateStats(total, pending, done);
}

function toggleDay(header) {
  const list = header.nextElementSibling;
  list.style.display = list.style.display === 'none' ? 'block' : 'none';
}

function toggleDone(id, markDone) {
  if (markDone) completedIds.add(id);
  else completedIds.delete(id);
  saveCompleted();
  render();
}

function clearAllCompleted() {
  if (!confirm('Tem certeza que deseja limpar TODOS os registros de concluídos?')) return;
  completedIds.clear();
  saveCompleted();
  render();
}

function exportCompleted() {
  const list = [...completedIds];
  if (!list.length) { alert('Nenhum evento concluído para exportar.'); return; }
  const blob = new Blob([JSON.stringify(list, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'completed_events.json';
  a.click();
  URL.revokeObjectURL(url);
}

function updateStats(total=0, pending=0, done=0) {
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-done').textContent = done;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Inicialização ─────────────────────────────────────────
loadCompleted();
loadData();
</script>

</body>
</html>
