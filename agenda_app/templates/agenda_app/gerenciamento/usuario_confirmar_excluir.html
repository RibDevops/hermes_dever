{% extends "agenda_app/base.html" %}{% block content %}
<h2 class="page-title">Confirmar exclusão</h2>
<p>Excluir usuário <strong>{{ obj.username }}</strong>?</p>
<form method="post" class="form-card" action="{% url 'gerenciamento_usuarios' %}">{% csrf_token %}<input type="hidden" name="acao" value="excluir_confirmado"><input type="hidden" name="id" value="{{ obj.id }}"><button class="btn btn-danger">Sim, excluir</button> <a href="{% url 'gerenciamento_usuarios' %}" class="cancel">Cancelar</a></form>
{% endblock %}
