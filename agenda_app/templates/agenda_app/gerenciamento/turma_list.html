{% extends "agenda_app/base.html" %}
{% block content %}
<h2 class="page-title">Gerenciamento — Turmas</h2>
<a href="{% url 'gerenciamento_turmas' %}?acao=criar" class="btn btn-primary">+ Nova Turma</a>
<div class="table-wrap"><table class="grid"><tr><th>Nome</th><th>Grade</th><th>Ativa</th><th>Ações</th></tr>
{% for t in turmas %}
<tr>
  <td>{{ t.nome }}</td>
  <td>{{ t.grade }}</td>
  <td>{{ t.ativa }}</td>
  <td>
    <a href="{% url 'gerenciamento_turmas' %}?acao=editar&id={{ t.id }}" class="btn">Editar</a>
    <form method="post" action="{% url 'gerenciamento_turmas' %}" class="inline-form">
      {% csrf_token %}
      <input type="hidden" name="acao" value="excluir">
      <input type="hidden" name="id" value="{{ t.id }}">
      <button class="btn btn-danger" onclick="return confirm('Excluir turma {{ t.nome }}?')">Excluir</button>
    </form>
  </td>
</tr>
{% empty %}
<tr><td colspan="4">Nenhuma turma cadastrada.</td></tr>
{% endfor %}
</table></div>
{% endblock %}
