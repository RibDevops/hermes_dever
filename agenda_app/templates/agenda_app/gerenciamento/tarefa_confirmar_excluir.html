{% extends "agenda_app/base.html" %}{% block content %}
<h2 class="page-title">Confirmar exclusão</h2>
<p>Excluir <strong>{{ obj.nome|default:obj.title|default:obj.username }}</strong>?</p>
<form method="post" class="form-card" action="/gerenciamento/">{% csrf_token %}<input type="hidden" name="tab" value="{{ tab }}"><input type="hidden" name="acao" value="excluir_confirmado"><input type="hidden" name="id" value="{{ obj.id }}"><button class="btn btn-danger">Sim, excluir</button> <a href="/gerenciamento/?tab={{ tab }}" class="cancel">Cancelar</a></form>
{% endblock %}
