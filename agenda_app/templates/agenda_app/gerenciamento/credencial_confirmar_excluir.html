{% extends "agenda_app/base.html" %}{% block content %}
<h2 class="page-title">Confirmar exclusão</h2>
<p>Excluir credencial <strong>{{ obj.turma.nome }} → {{ obj.usuario_portal }}</strong>?</p>
<form method="post" class="form-card" action="{% url 'gerenciamento_credenciais' %}">{% csrf_token %}<input type="hidden" name="acao" value="excluir_confirmado"><input type="hidden" name="id" value="{{ obj.id }}"><button class="btn btn-danger">Sim, excluir</button> <a href="{% url 'gerenciamento_credenciais' %}" class="cancel">Cancelar</a></form>
{% endblock %}
