{% extends "agenda_app/base.html" %}{% block content %}
<h2 class="page-title">Gerenciamento — Tarefas (somente leitura)</h2>
<div class="table-wrap"><table class="grid"><tr><th>ID</th><th>Data</th><th>Título</th><th>Turma</th></tr>
{% for obj in tarefas %}<tr><td>{{ obj.id }}</td><td>{{ obj.date }}</td><td>{{ obj.title }}</td><td>{{ obj.turma.nome|default:"-" }}</td></tr>{% empty %}<tr><td colspan="4">Nenhuma tarefa.</td></tr>{% endfor %}</table></div>
{% endblock %}
